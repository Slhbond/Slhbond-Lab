services:
  blog:
    build: .
    container_name: blog
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      # 文章、配置、图片随宿主机持久化；升级代码时不会覆盖这些数据
      - ./posts:/app/posts
      - ./config.js:/app/config.js
      - ./public:/app/public
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - SLH_DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
